_format_version: "3.0"

services:
  - name: auth
    url: http://auth:9999
    routes:
      - name: auth
        paths:
          - /auth/v1
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Client-Info
          exposed_headers:
            - Content-Range
            - X-Request-Id
          credentials: true
          max_age: 3600

  - name: rest
    url: http://rest:3000
    routes:
      - name: rest
        paths:
          - /rest/v1
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Client-Info
            - Prefer
            - Range
          exposed_headers:
            - Content-Range
            - X-Request-Id
          credentials: true
          max_age: 3600

  - name: realtime
    url: http://realtime:4000
    routes:
